<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/config.js"></script>
    <title>Reset Password - Changara Star Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001f5c 0%, #0b5394 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .reset-container {
            background: white; padding: 40px; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 420px;
        }
        .reset-container h1 { text-align: center; color: #001f5c; margin-bottom: 5px; }
        .reset-container .subtitle { text-align: center; color: #d4a017; margin-bottom: 30px; font-size: 14px; }
        .school-icon { text-align: center; font-size: 48px; display: block; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 5px; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 16px; transition: border-color 0.3s ease;
        }
        .form-group input:focus { border-color: #0b5394; outline: none; }
        .btn-reset {
            width: 100%; padding: 14px; background: #d4a017; color: #001f5c;
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-reset:hover { background: #e6c24d; transform: scale(1.02); }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .alert.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .back-link { text-align: center; margin-top: 15px; }
        .back-link a { color: #0b5394; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-container">
        <span class="school-icon">🏫</span>
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your email and we'll send a reset link</p>

        <div id="alert" class="alert"></div>

        <form id="resetForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="btn-reset">📧 Send Reset Link</button>
        </form>

        <div class="back-link">
            <a href="admin-login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const alertEl = document.getElementById('alert');

            if (!email) {
                alertEl.className = 'alert error';
                alertEl.style.display = 'block';
                alertEl.textContent = '❌ Please enter your email address.';
                return;
            }

            alertEl.className = 'alert';
            alertEl.style.display = 'none';

            try {
                const result = await window.apiJson('/api/admin/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                alertEl.className = 'alert success';
                alertEl.style.display = 'block';
                alertEl.textContent = '✅ ' + (result.message || 'If the email exists, a reset link has been sent.');
            } catch (error) {
                alertEl.className = 'alert error';
                alertEl.style.display = 'block';
                alertEl.textContent = '❌ ' + error.message;
            }
        });
    </script>
</body>
</html>
