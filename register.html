<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/config.js"></script>
    <title>Register - Changara Star Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001f5c 0%, #0b5394 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .register-container {
            background: white; padding: 40px; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 420px;
        }
        .register-container h1 { text-align: center; color: #001f5c; margin-bottom: 5px; }
        .register-container .subtitle { text-align: center; color: #d4a017; margin-bottom: 30px; font-size: 14px; }
        .school-icon { text-align: center; font-size: 48px; display: block; margin-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 16px; transition: border-color 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus { border-color: #0b5394; outline: none; }
        .btn-register {
            width: 100%; padding: 14px; background: #0b5394; color: white;
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-register:hover { background: #001f5c; transform: scale(1.02); }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .alert.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .back-link { text-align: center; margin-top: 15px; }
        .back-link a { color: #0b5394; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="register-container">
        <span class="school-icon">🏫</span>
        <h1>Create Your Account</h1>
        <p class="subtitle">Changara Star Academy - Register as Staff or Family</p>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUsername" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Choose a password" required>
            </div>
            <div class="form-group">
                <label>Register As</label>
                <select id="regRole" required>
                    <option value="">Select account type</option>
                    <option value="Family">Family / Parent</option>
                    <option value="Staff">Staff Member</option>
                </select>
            </div>
            <button type="submit" class="btn-register">Register</button>
        </form>

        <div class="back-link">
            <a href="admin-login.html">← Already have an account? Login</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const fullName = document.getElementById('regName').value;
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            const alertEl = document.getElementById('alert');

            if (!role) {
                alertEl.className = 'alert error';
                alertEl.style.display = 'block';
                alertEl.textContent = '❌ Please select an account type.';
                return;
            }

            alertEl.className = 'alert';
            alertEl.style.display = 'none';

            try {
                const result = await window.apiJson('/api/admin/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password, fullName, role: role })
                });
                if (result.success) {
                    alertEl.className = 'alert success';
                    alertEl.style.display = 'block';
                    alertEl.textContent = '✅ ' + (result.message || 'Registration successful!');
                    document.getElementById('registerForm').reset();
                } else {
                    alertEl.className = 'alert error';
                    alertEl.style.display = 'block';
                    alertEl.textContent = '❌ ' + (result.error || result.message || 'Registration failed');
                }
            } catch (error) {
                alertEl.className = 'alert error';
                alertEl.style.display = 'block';
                alertEl.textContent = '❌ ' + error.message;
            }
        });
    </script>
</body>
</html>
