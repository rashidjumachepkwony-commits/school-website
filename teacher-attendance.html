<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/config.js"></script>
    <title>Staff Attendance - Changara Star Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 20px auto;
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #001f5c;
            font-size: 22px;
            font-weight: 700;
        }
        .header p {
            color: #666;
            font-size: 16px;
            margin-top: 5px;
        }
        .info-bar {
            background: #f8f9fa;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .info-bar .label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
        .info-bar .value {
            font-size: 16px;
            font-weight: 600;
            color: #001f5c;
        }
        .btn-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-checkin { background: #28a745; color: white; }
        .btn-checkin:hover:not(:disabled) { background: #1e7e34; transform: translateY(-2px); }
        .btn-checkout { background: #dc3545; color: white; }
        .btn-checkout:hover:not(:disabled) { background: #c82333; transform: translateY(-2px); }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }
        .status-box .status-title {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .status-box .status-text {
            font-size: 20px;
            font-weight: bold;
            color: #6c757d;
        }
        .status-box .status-time {
            font-size: 16px;
            color: #333;
            margin-top: 5px;
        }
        .status-box .hours {
            font-size: 16px;
            color: #0b5394;
            margin-top: 8px;
            font-weight: 600;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
            display: none;
        }
        .alert.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
        .alert.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .alert.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; display: block; }
        .btn-home {
            width: 100%;
            padding: 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .kenyan-time {
            text-align: center;
            color: #0b5394;
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 500;
        }
        @media (max-width: 480px) {
            .container { padding: 20px; }
            .btn { font-size: 16px; padding: 16px; }
            .status-box .status-text { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="kenyan-time" id="kenyanTime">Kenya Time: Loading...</div>
    <div class="container">
        <div class="header">
            <h1>Changara Star Academy</h1>
            <p id="teacherName">Staff Attendance</p>
        </div>

        <div class="info-bar">
            <div class="label">Staff ID</div>
            <div class="value" id="staffIdDisplay"></div>
        </div>

        <div id="alert" class="alert"></div>

        <div class="status-box">
            <div class="status-title">Today's Status</div>
            <div class="status-text" id="statusText">Not checked in</div>
            <div class="status-time" id="statusTime"></div>
            <div class="hours" id="hoursWorked"></div>
        </div>

        <div class="btn-row">
            <button id="checkinBtn" class="btn btn-checkin" onclick="handleCheckin()">✅ CHECK IN</button>
            <button id="checkoutBtn" class="btn btn-checkout" onclick="handleCheckout()">🚪 CHECK OUT</button>
        </div>

        <button onclick="logout()" class="btn-home">🔓 Logout</button>
    </div>

    <script>
        const checkinBtn = document.getElementById('checkinBtn');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const statusText = document.getElementById('statusText');
        const statusTime = document.getElementById('statusTime');
        const hoursWorked = document.getElementById('hoursWorked');
        const alertDiv = document.getElementById('alert');
        const kenyanTimeEl = document.getElementById('kenyanTime');

        function getKenyanTime() {
            const now = new Date();
            return new Date(now.toLocaleString('en-US', { timeZone: 'Africa/Nairobi' }));
        }

        function updateKenyanTime() {
            const k = getKenyanTime();
            kenyanTimeEl.textContent = 'Kenya Time: ' + k.toLocaleTimeString('en-KE', {
                hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        }

        function showAlert(message, type) {
            alertDiv.className = 'alert ' + type;
            alertDiv.textContent = message;
            setTimeout(() => { alertDiv.style.display = 'none'; }, 5000);
        }

        function getTeacher() {
            const stored = sessionStorage.getItem('teacher');
            if (!stored) {
                window.location.href = 'teacher-login.html';
                return null;
            }
            return JSON.parse(stored);
        }

        function updateButtons(checkedIn, checkedOut) {
            if (checkedOut) {
                checkinBtn.disabled = true;
                checkoutBtn.disabled = true;
                statusText.textContent = 'Checked Out';
                statusText.className = 'status-text';
            } else if (checkedIn) {
                checkinBtn.disabled = true;
                checkoutBtn.disabled = false;
                statusText.textContent = 'Checked In';
                statusText.className = 'status-text';
            } else {
                checkinBtn.disabled = false;
                checkoutBtn.disabled = true;
                statusText.textContent = 'Not Checked In';
                statusText.className = 'status-text';
            }
        }

        async function loadTodayStatus() {
            const teacher = getTeacher();
            if (!teacher) return;

            document.getElementById('staffIdDisplay').textContent = teacher.employeeId;
            document.getElementById('teacherName').textContent = 'Good ' + (new Date().getHours() < 12 ? 'morning' : new Date().getHours() < 17 ? 'afternoon' : 'evening') + ', ' + teacher.name;

            try {
                const response = await fetch(apiUrl('/api/teacher/attendance/today'), {
                    headers: { 'Authorization': 'Bearer ' + (teacher.token || '') }
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                if (data.success && data.attendance && data.attendance.length > 0) {
                    const record = data.attendance[0];
                    const checkedIn = record.status === 'Checked In' || record.status === 'Late' || record.status === 'Present' || record.checkInTime;
                    const checkedOut = record.status === 'Checked Out' || (record.checkOutTime && record.hoursWorked !== null);

                    updateButtons(checkedIn, checkedOut);

                    if (checkedOut) {
                        statusTime.textContent = 'Check-out: ' + (record.checkOutTime || '--:--');
                        hoursWorked.textContent = 'Hours: ' + (record.hoursWorked || 0) + ' hrs';
                    } else if (checkedIn) {
                        statusTime.textContent = 'Check-in: ' + (record.checkInTime || '--:--');
                        hoursWorked.textContent = '';
                    } else {
                        statusText.textContent = 'Not checked in';
                        statusTime.textContent = '';
                        hoursWorked.textContent = '';
                    }
                } else {
                    updateButtons(false, false);
                    statusText.textContent = 'Not checked in';
                }
            } catch (error) {
                showAlert('Unable to load attendance. Please refresh.', 'error');
                updateButtons(false, false);
            }
        }

        async function handleCheckin() {
            const teacher = getTeacher();
            if (!teacher) return;

            checkinBtn.disabled = true;
            checkoutBtn.disabled = true;
            checkinBtn.textContent = 'CHECKING IN...';
            checkoutBtn.textContent = 'CHECKING OUT...';

            try {
                const response = await fetch(apiUrl('/api/teacher/checkin'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (teacher.token || '')
                    },
                    body: JSON.stringify({ employeeId: teacher.employeeId })
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('Check-in successful!', 'success');
                    statusText.textContent = 'Checked In';
                    statusText.className = 'status-text';
                    statusTime.textContent = 'Time: ' + (result.checkInTimeFormatted || result.checkInTime || '--:--');
                    hoursWorked.textContent = result.isLate ? 'Late arrival' : '';
                    updateButtons(true, false);
                } else {
                    if (result.error && result.error.includes('401')) {
                        showAlert('Authentication error. Please log in again.', 'error');
                    } else if (result.error && result.error.includes('409')) {
                        showAlert('You have already checked in today.', 'error');
                        loadTodayStatus();
                    } else {
                        showAlert(result.message || result.error || 'Unable to check in right now.', 'error');
                    }
                }
            } catch (error) {
                showAlert('Unable to connect to the attendance server. Please try again.', 'error');
            } finally {
                checkinBtn.disabled = false;
                checkoutBtn.disabled = false;
                checkinBtn.textContent = '✅ CHECK IN';
                checkoutBtn.textContent = '🚪 CHECK OUT';
            }
        }

        async function handleCheckout() {
            const teacher = getTeacher();
            if (!teacher) return;

            checkinBtn.disabled = true;
            checkoutBtn.disabled = true;
            checkinBtn.textContent = 'CHECKING IN...';
            checkoutBtn.textContent = 'CHECKING OUT...';

            try {
                const response = await fetch(apiUrl('/api/teacher/checkout'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (teacher.token || '')
                    },
                    body: JSON.stringify({ employeeId: teacher.employeeId })
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('Check-out successful!', 'success');
                    statusText.textContent = 'Checked Out';
                    statusText.className = 'status-text';
                    statusTime.textContent = 'Check-out: ' + (result.checkOutTimeFormatted || result.checkOutTime || '--:--');
                    hoursWorked.textContent = 'Hours Worked: ' + (result.hoursWorked || 0) + ' hrs';
                    updateButtons(false, true);
                    checkinBtn.disabled = true;
                } else {
                    if (result.error && result.error.includes('401')) {
                        showAlert('Authentication error. Please log in again.', 'error');
                    } else if (result.error && result.error.includes('409')) {
                        showAlert('You have already checked out today.', 'error');
                        loadTodayStatus();
                    } else if (result.error && result.error.includes('400')) {
                        showAlert('Please check in first.', 'error');
                        loadTodayStatus();
                    } else {
                        showAlert(result.message || result.error || 'Unable to check out right now.', 'error');
                    }
                }
            } catch (error) {
                showAlert('Unable to connect to the attendance server. Please try again.', 'error');
            } finally {
                checkinBtn.disabled = false;
                checkoutBtn.disabled = false;
                checkinBtn.textContent = '✅ CHECK IN';
                checkoutBtn.textContent = '🚪 CHECK OUT';
            }
        }

        function logout() {
            sessionStorage.removeItem('teacher');
            window.location.href = 'teacher-login.html';
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateKenyanTime();
            setInterval(updateKenyanTime, 1000);
            loadTodayStatus();
        });
    </script>
</body>
</html>
