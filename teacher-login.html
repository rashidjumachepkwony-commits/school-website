<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/config.js"></script>
    <title>Staff Login - Changara Star Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001f5c 0%, #0b5394 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #001f5c;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .header p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            border-color: #0b5394;
            outline: none;
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            background: #0b5394;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-login:hover {
            background: #001f5c;
        }
        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
            text-align: center;
        }
        .alert.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .btn-home {
            width: 100%;
            padding: 12px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Changara Star Academy</h1>
            <p>Staff Login</p>
        </div>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Staff ID</label>
                <input type="text" id="staffId" placeholder="Enter your Staff ID" required autofocus>
            </div>
            <div class="form-group">
                <label>4-Digit PIN</label>
                <input type="password" id="pin" placeholder="Enter PIN" maxlength="4" required>
            </div>
            <button type="submit" id="loginBtn" class="btn-login">Login</button>
        </form>

        <button onclick="window.location.href='index.html'" class="btn-home">Home</button>
    </div>

    <script>
        const staffIdInput = document.getElementById('staffId');
        const pinInput = document.getElementById('pin');
        const loginBtn = document.getElementById('loginBtn');
        const alertDiv = document.getElementById('alert');

        function showAlert(message, type) {
            alertDiv.className = 'alert ' + type;
            alertDiv.textContent = message;
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const staffId = staffIdInput.value.trim();
            const pin = pinInput.value.trim();

            if (!staffId || !pin) {
                showAlert('Please enter both Staff ID and PIN', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch(apiUrl('/api/teacher/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ employeeId: staffId, pin: pin })
                });

                const result = await response.json();

                if (result.success) {
                    sessionStorage.setItem('teacher', JSON.stringify({
                        employeeId: result.staff.employeeId,
                        name: result.staff.name,
                        token: result.token
                    }));
                    showAlert('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'teacher-attendance.html';
                    }, 1000);
                } else {
                    showAlert(result.message || 'Incorrect Staff ID or PIN.', 'error');
                }
            } catch (error) {
                showAlert('Unable to connect to the server. Please try again.', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            staffIdInput.focus();
        });
    </script>
</body>
</html>
