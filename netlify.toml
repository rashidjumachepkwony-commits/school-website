[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Proxy /api/* requests to the Cloudflare Worker.
# NOTE: CORS is handled by the Worker itself. Do NOT add an
# Access-Control-Allow-Origin header here — a duplicate CORS header on the
# proxied response would cause browsers to reject the request.
[[redirects]]
  from = "/api/*"
  to = "https://csa-api.rashidjumachepkwony.workers.dev/api/:splat"
  status = 200
  force = true

# ── Source/config files are NOT part of the public website. ──
# Block them so backend source code cannot be downloaded from the site.
[[redirects]]
  from = "/server.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/worker/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/models/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# No SPA fallback: this is a multi-page static site and every internal link
# uses explicit .html paths. A `/* /index.html 200` catch-all would mask 404
# errors and shadow the pretty-URLs post-processing. Unmatched paths are now
# served 404.html automatically by Netlify.
