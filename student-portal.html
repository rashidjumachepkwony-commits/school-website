<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="js/config.js"></script>
<title>Student Portal - Changara Star Academy</title>
<meta name="description" content="Parent and student portal. Check assessment results, holiday assignments and fees balance at Changara Star Academy.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* Large, high-contrast styling: this page is used by parents, many of whom
     are older and may be using a small phone screen. */
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --ink:#0a1628; --ink-soft:#3c4d68; --gold:#d4a017; --line:#d7dfeb;
    --bg:#f2f5f9; --ok:#0b7a3b; --warn:#9a6400; --bad:#a4161a;
  }
  html { font-size: 19px; }
  body { font-family:"Segoe UI",Tahoma,Verdana,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }

  header { background:linear-gradient(135deg,var(--ink),#1d3a6b); color:#fff; padding:22px 18px; text-align:center; border-bottom:5px solid var(--gold); }
  header h1 { font-size:1.55rem; line-height:1.25; }
  header p { font-size:1rem; color:#d8e2f2; margin-top:6px; }
  header .home { display:inline-block; margin-top:12px; background:#fff; color:var(--ink); padding:10px 20px; border-radius:10px; text-decoration:none; font-weight:700; font-size:1rem; }

  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 20px; margin:18px 0; box-shadow:0 2px 10px rgba(10,22,40,.05); }
  .card h2 { font-size:1.3rem; margin-bottom:6px; }
  .card .hint { color:var(--ink-soft); font-size:1rem; margin-bottom:16px; }

  label { display:block; font-weight:700; font-size:1.05rem; margin:0 0 8px; }
  input, select { width:100%; padding:15px 14px; font-size:1.1rem; font-family:inherit; border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  input:focus, select:focus { outline:none; border-color:var(--gold); }
  .btn { display:block; width:100%; margin-top:16px; padding:17px; font-size:1.15rem; font-weight:800; font-family:inherit; border:0; border-radius:12px; background:var(--gold); color:var(--ink); cursor:pointer; }
  .btn:hover { background:#c1900f; }
  .btn.sec { background:var(--ink); color:#fff; margin-top:10px; }
  .btn.sec:hover { background:#1d3a6b; }

  .match { margin-top:14px; padding:16px; border:2px dashed var(--gold); border-radius:12px; background:#fffaf0; }
  .match p { font-weight:700; margin-bottom:12px; }

  .tabs { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:6px 0 4px; }
  .tab { padding:15px 8px; text-align:center; border:2px solid var(--line); border-radius:12px; background:#fff; cursor:pointer; font-weight:700; font-size:1rem; }
  .tab .ico { display:block; font-size:1.5rem; margin-bottom:4px; }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }

  .pupil { background:#f7f9fc; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .pupil .nm { font-size:1.2rem; font-weight:800; }
  .pupil .mt { color:var(--ink-soft); font-size:.98rem; }

  table { width:100%; border-collapse:collapse; margin:10px 0 4px; }
  th, td { border:1px solid var(--line); padding:12px 10px; text-align:left; font-size:1rem; }
  th { background:var(--ink); color:#fff; }
  .num { text-align:right; }
  .lvl { padding:3px 10px; border-radius:8px; font-weight:800; font-size:.92rem; white-space:nowrap; }
  .ee{background:#dff3e4;color:#136b2c} .me{background:#dbeafe;color:#12459b}
  .ae{background:#fff3cd;color:#856404} .be{background:#fbdcdc;color:#8c1c24}

  .big { font-size:1.5rem; font-weight:800; }
  .good { color:var(--ok); } .due { color:var(--bad); }
  .bar { height:18px; background:#e8edf5; border-radius:10px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; background:var(--gold); }
  .dl { display:inline-block; margin-top:8px; padding:12px 18px; background:#fff; border:2px solid var(--ink); border-radius:10px; color:var(--ink); text-decoration:none; font-weight:700; }

  .note { background:#fff8e6; border-left:5px solid var(--gold); padding:14px 16px; border-radius:8px; margin:12px 0; }
  .msg { padding:15px; border-radius:10px; font-weight:700; margin:14px 0; display:none; }
  .msg.show { display:block; }
  .msg.err { background:#fbdcdc; color:#8c1c24; }
  .msg.ok { background:#dff3e4; color:#136b2c; }
  .foot { text-align:center; color:var(--ink-soft); font-size:.95rem; padding:18px; }
  /* ===== NAME LOOKUP =====
     The suggestion list is positioned above the field, so on a phone the
     names appear next to the box the parent is typing in rather than being
     pushed below the on-screen keyboard. */
  .lookup { position:relative; }
  .suggest {
    position:absolute; left:0; right:0; bottom:calc(100% + 6px); z-index:40;
    background:#fff; border:2px solid var(--gold); border-radius:12px;
    box-shadow:0 10px 28px rgba(10,22,40,.18); overflow:hidden; max-height:260px; overflow-y:auto;
  }
  .suggest[hidden] { display:none; }
  .suggest button {
    display:flex; width:100%; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px; font-size:1.05rem; font-family:inherit; text-align:left;
    background:#fff; color:var(--ink); border:0; border-bottom:1px solid #eef2f7; cursor:pointer;
  }
  .suggest button:last-child { border-bottom:0; }
  .suggest button:hover, .suggest button:focus { background:#fff8e1; outline:none; }
  .suggest .s-adm { font-size:.85rem; color:#6b7a92; font-weight:700; white-space:nowrap; }
  .suggest .s-gr { font-size:.8rem; color:#8a97ab; white-space:nowrap; }
  .suggest .none { padding:14px 16px; font-size:.98rem; color:#7d8ba3; }

  /* ===== ASSESSMENT RESULT CARD ===== */
  .res-card {
    background:#fff; border:1px solid #e3e9f2; border-radius:16px; overflow:hidden;
    margin-bottom:18px; box-shadow:0 2px 10px rgba(10,22,40,.06);
  }
  .res-head {
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:16px 18px; background:linear-gradient(135deg,#0A1628,#1d3a6b); color:#fff;
  }
  .res-period { font-size:1.15rem; font-weight:800; color:#fff; margin:0; line-height:1.25; }
  .res-type { font-size:.95rem; color:#c9d6e8; margin:3px 0 0; }
  .res-level {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:120px; padding:9px 14px; border-radius:12px; text-align:center;
  }
  .res-level-code { font-size:1.4rem; font-weight:800; line-height:1; }
  .res-level-name { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-top:3px; }
  .lvl-ee { background:#dff3e4; color:#136b2c; }
  .lvl-me { background:#dbeafe; color:#12459b; }
  .lvl-ae { background:#fff3cd; color:#856404; }
  .lvl-be { background:#fbdcdc; color:#8c1c24; }
  .lvl-none{ background:#eceff4; color:#8a97ab; }

  .res-figures { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:#eef2f7; }
  .fig { background:#fff; padding:14px 10px; text-align:center; }
  .fig-v { font-size:1.3rem; font-weight:800; color:#0A1628; line-height:1.15; letter-spacing:-.3px; }
  .fig-k { font-size:.68rem; font-weight:700; color:#8a97ab; text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }

  .res-mix { display:flex; flex-wrap:wrap; gap:6px; padding:12px 18px 0; }
  .mchip { padding:3px 10px; border-radius:9px; font-size:.72rem; font-weight:800; letter-spacing:.3px; }
  .mchip.ee{background:#dff3e4;color:#136b2c} .mchip.me{background:#dbeafe;color:#12459b}
  .mchip.ae{background:#fff3cd;color:#856404} .mchip.be{background:#fbdcdc;color:#8c1c24}

  .res-table-wrap { padding:12px 18px 0; }
  .res-table { width:100%; border-collapse:separate; border-spacing:0; font-size:.98rem; }
  .res-table thead th {
    background:#f2f5fa; color:#5a6b85; text-align:left; padding:10px;
    font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.4px;
    border-bottom:2px solid #e3e9f2;
  }
  .res-table tbody td { padding:11px 10px; border-bottom:1px solid #eef2f7; }
  .res-table tbody tr:last-child td { border-bottom:0; }
  .res-table .c-subj { font-weight:600; color:#1d2c47; }
  .res-table .c-score, .res-table .c-out, .res-table .c-pct { text-align:right; font-variant-numeric:tabular-nums; }
  .res-table .c-out, .res-table .c-pct { color:#5f6f88; }
  .res-table .c-lv { text-align:center; width:70px; }
  .res-table tbody tr.lv-ee { background:#f6fdf8; } .res-table tbody tr.lv-me { background:#f5f9ff; }
  .res-table tbody tr.lv-ae { background:#fffdf3; } .res-table tbody tr.lv-be { background:#fef7f7; }
  .tag { display:inline-block; padding:2px 9px; border-radius:9px; font-size:.72rem; font-weight:800; }
  .tag.lv-ee{background:#dff3e4;color:#136b2c} .tag.lv-me{background:#dbeafe;color:#12459b}
  .tag.lv-ae{background:#fff3cd;color:#856404} .tag.lv-be{background:#fbdcdc;color:#8c1c24}

  .res-dl {
    display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
    margin:0; padding:15px; font-size:1.02rem; font-weight:800; font-family:inherit;
    background:#a4161a; color:#fff; border:0; border-radius:11px; cursor:pointer;
  }
  .res-dl:hover { background:#8f0e12; }
  .res-dl.alt { background:#0A1628; }
  .res-dl.alt:hover { background:#16305c; }
  .res-acts { display:grid; grid-template-columns:1fr; gap:8px; margin:16px 18px 18px; }
  @media (max-width:560px){
    .res-figures { grid-template-columns:repeat(2,1fr); }
    .res-level { min-width:100%; flex-direction:row; gap:9px; }
    .res-table { font-size:.9rem; }
    .res-table thead th, .res-table tbody td { padding:9px 7px; }
  }

  .back { background:none; border:0; color:var(--ink); font-size:1.05rem; font-weight:700; text-decoration:underline; margin-bottom:14px; cursor:pointer; font-family:inherit; }

  /* Sticky lookup bar: stays reachable at the top of a phone screen, so a
     parent never has to scroll to search for another child. */
  .topbar {
    position: sticky; top: 0; z-index: 30; background: var(--ink); color: #fff;
    padding: 10px 14px; box-shadow: 0 2px 8px rgba(10,22,40,.25);
  }
  .topbar .inner { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .topbar .title { font-weight: 800; font-size: 1rem; white-space: nowrap; }
  .topbar input { flex: 1 1 180px; padding: 12px; font-size: 1.05rem; border-radius: 10px; border: 2px solid #c9d3e2; }
  .topbar input:focus { outline: none; border-color: var(--gold); }
  .topbar .btn { width: auto; margin: 0; padding: 12px 20px; white-space: nowrap; }
  .topbar .home { display:none; }

  @media (max-width:600px){ html{font-size:18px} .tabs{grid-template-columns:1fr} .topbar .title{display:none} }
</style>
</head>
<body>
<header>
  <h1>Student &amp; Parent Portal</h1>
  <p>Changara Star Academy</p>
  <a class="home" href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
</header>

<div class="topbar">
  <div class="inner">
    <span class="title">Find a Child</span>
    <div class="lookup">
      <input type="text" id="topSearch" placeholder="Type a name or admission number" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
      <!-- Suggestions open under this bar, so the names are always visible
           on a phone and a single tap opens the child. -->
      <div id="suggest" class="suggest" role="listbox" hidden></div>
    </div>
    <button class="btn" onclick="searchFromTop()"><i class="fas fa-search"></i> Search</button>
    <a class="btn" href="index.html" style="background:#fff;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;"><i class="fas fa-home"></i> Home</a>
  </div>
</div>

<div class="wrap">
  <div class="msg" id="msg"></div>

  <!-- The bar above is the only lookup: one clear place to find a child. -->

  <!-- STEP 1 : choose what to see -->
  <div class="card" id="step2" style="display:none">
    <button class="back" onclick="backToSearch()">&larr; Not this child? Search again</button>
    <h2><i class="fas fa-user-circle"></i> Choose Your Child</h2>
    <div class="pupil" id="pupil"></div>
    <p class="hint">Now tap what you would like to see:</p>
    <div class="tabs">
      <div class="tab on" data-view="results" onclick="showView('results')">
        <span class="ico">&#128202;</span>Assessment Results
      </div>
      <div class="tab" data-view="assignments" onclick="showView('assignments')">
        <span class="ico">&#128196;</span>Holiday Assignments
      </div>
      <div class="tab" data-view="fees" onclick="showView('fees')">
        <span class="ico">&#128176;</span>Fees Balance
      </div>
    </div>
  </div>

  <!-- STEP 3 : the chosen information -->
  <div class="card" id="step3" style="display:none">
    <button class="back" onclick="backToChild()">&larr; Back to the three choices</button>
    <h2 id="viewTitle"></h2>
    <div id="viewBody"></div>
  </div>
</div>

<div class="foot">Changara Star Academy &middot; For help, please contact the school office.</div>

<script>
let allStudents = [];
let current = null;

document.addEventListener('DOMContentLoaded', () => {
  loadStudents();
  const top = document.getElementById('topSearch');
  top.addEventListener('input', filterStudents);
  top.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); searchFromTop(); } });

  const suggest = document.getElementById('suggest');
  suggest.addEventListener('click', function (e) {
    const b = e.target.closest('button[data-id]');
    if (b) pickStudent(b.dataset.id);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSuggest(); });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.lookup')) closeSuggest();
  });
});

  /** Called by the sticky Search button: filter from the bar at the top. */
  function searchFromTop() {
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step3').style.display = 'none';
    filterStudents();
  }

async function loadStudents() {
  try {
    const res = await window.apiJson('/api/portal/students');
    allStudents = res.students || [];
    if (!allStudents.length) {
      showMsg('The list of students is empty. Please contact the school office.', 'err');
    }
  } catch (e) {
    showMsg('Could not load the student list. Please check your connection and try again.', 'err');
  }
}

/**
 * Type-ahead lookup. Matching names are offered in a panel that sits directly
 * under the search box, so a parent on a phone can see and tap a name without
 * the on-screen keyboard covering the list. Tapping a name opens that child
 * straight away, with no extra Continue step.
 */
function filterStudents() {
  const input = document.getElementById('topSearch');
  const q = input.value.trim().toLowerCase();
  const box = document.getElementById('suggest');

  if (q.length < 1) {
    box.innerHTML = '';
    box.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    return;
  }

  const hits = allStudents.filter(s =>
    s.name.toLowerCase().includes(q) || (s.admissionNumber || '').toLowerCase().includes(q)
  ).slice(0, 40);

  if (!hits.length) {
    box.innerHTML = '<div class="none">No match for "' + esc(input.value.trim()) +
      '". Check the spelling, or try the admission number.</div>';
    box.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    return;
  }

  box.innerHTML = hits.map(s =>
    '<button type="button" role="option" data-id="' + s.id + '">' +
      '<span>' + esc(s.name) + '</span>' +
      '<span class="s-adm">' + esc(s.admissionNumber || 'no adm. no.') + '</span>' +
      (s.grade ? '<span class="s-gr">' + esc(s.grade) + '</span>' : '') +
    '</button>'
  ).join('');
  box.hidden = false;
  input.setAttribute('aria-expanded', 'true');
}

/** Open a child straight from the suggestion list. */
function pickStudent(id) {
  openStudent(id);
}

/** Close the suggestion panel when tapping away or pressing Escape. */
function closeSuggest() {
  const box = document.getElementById('suggest');
  if (box) { box.hidden = true; box.innerHTML = ''; }
  const input = document.getElementById('topSearch');
  if (input) input.setAttribute('aria-expanded', 'false');
}

async function openStudent(id) {
  if (!id) { showMsg('Please tap your child\'s name from the list.', 'err'); return; }
  showMsg('', '');
  document.getElementById('step2').style.display = 'block';
  document.getElementById('step3').style.display = 'none';
  window.scrollTo(0, 0);

  try {
    const data = await window.apiJson('/api/portal/student/' + encodeURIComponent(id));
    current = data;
    const s = data.student;
    document.getElementById('pupil').innerHTML =
      '<div class="nm">' + esc(s.name) + '</div>' +
      '<div class="mt">Admission No: ' + esc(s.admissionNumber || '-') + ' &middot; ' + esc(s.grade) +
      ' &middot; ' + esc(s.studentType) + '</div>' +
      (s.guardianPhone ? '<div class="mt">Parent contact: ' + esc(s.guardianPhone) + '</div>' : '');
    showView('results');
  } catch (e) {
    showMsg('Could not open this student. Please try again.', 'err');
  }
}

function backToSearch() {
  document.getElementById('step2').style.display = 'none';
  document.getElementById('step3').style.display = 'none';
  closeSuggest();
  const top = document.getElementById('topSearch');
  top.value = '';
  top.focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToChild() {
  document.getElementById('step3').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
}

function showView(view) {
  if (!current) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === view));
  document.getElementById('step3').style.display = 'block';

  const body = document.getElementById('viewBody');
  if (view === 'results') { document.getElementById('viewTitle').textContent = 'Assessment Results'; body.innerHTML = renderResults(current); }
  if (view === 'assignments') { document.getElementById('viewTitle').textContent = 'Holiday Assignments'; body.innerHTML = renderAssignments(current); }
  if (view === 'fees') { document.getElementById('viewTitle').textContent = 'Fees Balance'; body.innerHTML = renderFees(current); }
  window.scrollTo(0, 0);
}

function renderResults(d) {
  if (!d.assessments.length) {
    return empty('There are no assessment results for this child yet. Results appear here as soon as the teacher enters them.');
  }

  let html = '';
  for (const a of d.assessments) {
    // Mean performance level on the 01-04 scale, from the subject levels.
    const mix = a.subjectMix || {};
    const ratings = { BE: 1, AE: 2, ME: 3, EE: 4 };
    const codes = Object.keys(mix).filter(c => ratings[c]);
    const avgLevel = codes.length
      ? (codes.reduce((s, c) => s + ratings[c] * mix[c], 0) /
         codes.reduce((s, c) => s + mix[c], 0)).toFixed(2)
      : null;

    const rows = a.subjects.map(s => {
      const code = s.code || '';
      const pct = (s.score !== null && s.max > 0) ? (s.score / s.max) * 100 : null;
      const cls = code ? ' lv-' + code.toLowerCase() : '';
      return '<tr class="' + cls + '">' +
        '<td class="c-subj">' + esc(s.subject) + '</td>' +
        '<td class="c-score">' + (s.score === null ? '–' : '<b>' + s.score + '</b>') + '</td>' +
        '<td class="c-out">' + (s.max || '–') + '</td>' +
        '<td class="c-pct">' + (pct === null ? '–' : pct.toFixed(1) + '%') + '</td>' +
        '<td class="c-lv">' + (code ? '<span class="tag ' + cls + '">' + code + '</span>' : '–') + '</td>' +
      '</tr>';
    }).join('');

    const chips = ['EE', 'ME', 'AE', 'BE']
      .filter(c => mix[c])
      .map(c => '<span class="mchip ' + c.toLowerCase() + '">' + mix[c] + ' × ' + c + '</span>')
      .join('');

    html += '<article class="res-card">' +
      '<header class="res-head">' +
        '<div>' +
          '<h3 class="res-period">' + esc(a.period || 'Assessment') + '</h3>' +
          '<p class="res-type">' + esc(a.type || '') +
            (a.name && a.name !== a.type ? ' &middot; ' + esc(a.name) : '') + '</p>' +
        '</div>' +
        '<div class="res-level ' + levelClass(a.performanceLevel) + '">' +
          '<span class="res-level-code">' + esc(a.performanceCode || 'NA') + '</span>' +
          '<span class="res-level-name">' + esc(a.performanceLevel || 'Not Assessed') + '</span>' +
        '</div>' +
      '</header>' +

      '<div class="res-figures">' +
        figure('Total score', a.total + ' / ' + a.maxTotal) +
        figure('Average', a.average === null ? '–' : a.average) +
        figure('Average %', a.percentage === null ? '–' : a.percentage + '%') +
        figure('Average level', avgLevel === null ? '–' : avgLevel + ' / 4') +
      '</div>' +

      (chips ? '<div class="res-mix">' + chips + '</div>' : '') +

      '<div class="res-table-wrap"><table class="res-table">' +
        '<thead><tr><th>Subject</th><th class="c-score">Score</th><th class="c-out">Out of</th>' +
        '<th class="c-pct">%</th><th class="c-lv">Level</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>' +

      '<div class="res-acts">' +
        '<button class="res-dl" onclick="downloadResult()">' +
          '<i class="fas fa-download"></i> Save PDF to my phone</button>' +
        '<button class="res-dl alt" onclick="printResult()">' +
          '<i class="fas fa-print"></i> View / Print</button>' +
      '</div>' +
    '</article>';
  }
  return html + gradingKeyHtml(d.gradingKey);
}

function figure(label, value) {
  return '<div class="fig"><div class="fig-v">' + value + '</div><div class="fig-k">' + label + '</div></div>';
}

function levelClass(level) {
  return ({ 'Exceeding Expectation': 'lvl-ee', 'Meeting Expectation': 'lvl-me',
            'Approaching Expectation': 'lvl-ae', 'Below Expectation': 'lvl-be' })[level] || 'lvl-none';
}

/** Build the report URL for the result currently on screen. */
function resultUrl(extra) {
  const a = (current.assessments || [])[0];
  const p = new URLSearchParams();
  if (a) {
    if (a.period) p.set('period', a.period);
    if (a.type) p.set('type', a.type);
    if (a.name) p.set('name', a.name);
  }
  if (extra) p.set(extra, '1');
  const base = '/api/assessments/student-report/' + encodeURIComponent(current.student.id);
  return apiUrl(base + (p.toString() ? '?' + p.toString() : ''));
}

/**
 * Save the result as a real PDF file. Using a link with download means the
 * phone saves it to its Files or Downloads folder, instead of opening a print
 * dialog that a parent then has to work out.
 */
async function downloadResult() {
  if (!current || !current.student) return;
  const url = resultUrl('download');
  const name = 'CBE-Result-' + current.student.name.replace(/[^A-Za-z0-9]+/g, '-') + '.pdf';
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  showMsg('Saving ' + name + ' to your device.', 'ok');
}

function printResult() {
  if (!current || !current.student) return;
  // The same professional result slip, opened for viewing or printing.
  const w = window.open(resultUrl(), '_blank');
  if (!w) { showMsg('Please allow popups to view the result.', 'err'); return; }
}

function renderAssignments(d) {
  if (!d.assignments.length) {
    return empty('There are no holiday assignments uploaded for this class yet. Please check again later.');
  }
  return d.assignments.map(a =>
    '<div class="pupil">' +
      '<div class="nm">' + esc(a.title) + '</div>' +
      '<div class="mt">' + esc(a.subject || '') + (a.term ? ' &middot; ' + esc(a.term) : '') + '</div>' +
      (a.description ? '<div class="mt" style="margin-top:6px">' + esc(a.description) + '</div>' : '') +
      (a.fileUrl ? '<a class="dl" href="' + esc(a.fileUrl) + '" target="_blank" rel="noopener"><i class="fas fa-download"></i> Download ' + esc(a.fileName || 'the file') + '</a>' : '<div class="mt">No file attached.</div>') +
    '</div>'
  ).join('');
}

function renderFees(d) {
  const f = d.fees;
  const paidPct = f.total > 0 ? Math.min(100, Math.round((f.paid / f.total) * 100)) : 0;
  return '<div class="pupil">' +
    '<div class="mt">Total fees for the year</div><div class="big">' + f.currency + ' ' + f.total.toLocaleString() + '</div>' +
    '<div class="bar"><i style="width:' + paidPct + '%"></i></div>' +
    '<table style="margin-top:14px">' +
      '<tr><td>Amount paid</td><td class="num good">' + f.currency + ' ' + f.paid.toLocaleString() + '</td></tr>' +
      '<tr><td>Balance remaining</td><td class="num ' + (f.balance > 0 ? 'due' : 'good') + '">' + f.currency + ' ' + f.balance.toLocaleString() + '</td></tr>' +
    '</table>' +
    (f.balance > 0
      ? '<div class="note">There is a balance still to be paid. Please speak to the clerk about payment plans if this is difficult.</div>'
      : '<div class="msg ok show">All fees are fully paid. Thank you.</div>') +
    (f.structure && f.structure.length
      ? '<h3 style="margin:18px 0 6px;font-size:1.1rem">Fee breakdown</h3><table><tr><th>Type</th><th>Term</th><th class="num">Amount</th></tr>' +
        f.structure.map(s => '<tr><td>' + esc(s.type || '-') + '</td><td>' + esc(s.term || '-') + '</td><td class="num">' + f.currency + ' ' + s.amount.toLocaleString() + '</td></tr>').join('') +
        '</table>'
      : '') +
    '</div>';
}

function gradingKeyHtml(key) {
  if (!key || !key.length) return '';
  return '<div class="note"><b>What the levels mean</b><br>' +
    key.map(k => '<b>' + esc(k.code) + '</b> ' + esc(k.name) + ' (' + k.min + '&ndash;' + k.max + '%)').join('<br>') +
    '</div>';
}

function levelBadge(level, code) {
  const cls = { 'Exceeding Expectation': 'ee', 'Meeting Expectation': 'me', 'Approaching Expectation': 'ae', 'Below Expectation': 'be' }[level] || '';
  return '<span class="lvl ' + cls + '">' + esc(level) + (code && code !== 'NA' ? ' (' + esc(code) + ')' : '') + '</span>';
}

function empty(msg) { return '<div class="note">' + esc(msg) + '</div>'; }

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg' + (text ? ' show ' + type : '');
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>
