<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.5/dist/umd/supabase.min.js"></script>
    <title>Authentication Callback - Changara Star Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001f5c 0%, #0b5394 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .callback-container {
            background: white; padding: 40px; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 420px;
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #0b5394;
            border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; }
        .alert.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <div class="callback-container">
        <div id="spinner" class="spinner"></div>
        <h1>Authentication Callback</h1>
        <p class="subtitle">Completing your sign-in...</p>
        <div id="alert" class="alert" style="display:none;"></div>
    </div>

    <script>
        (async function() {
            const alertEl = document.getElementById('alert');
            const spinnerEl = document.getElementById('spinner');
            const showAlert = function(msg, type) {
                spinnerEl.style.display = 'none';
                alertEl.className = 'alert ' + type;
                alertEl.style.display = 'block';
                alertEl.textContent = msg;
            };

            // Fetch Supabase config from the Worker
            let supabaseUrl = '', supabaseAnonKey = '';
            try {
                const cfg = await window.apiJson('/api/config');
                supabaseUrl = cfg.supabaseUrl || '';
                supabaseAnonKey = cfg.supabaseAnonKey || '';
            } catch (e) {
                showAlert('Could not load server configuration. Please try again.', 'error');
                return;
            }

            if (!supabaseUrl || !supabaseAnonKey) {
                showAlert('Supabase is not configured on the server yet.', 'error');
                return;
            }

            // Initialize Supabase client
            const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

            try {
                // Attempt to retrieve the session via the SDK. It reads the
                // URL hash for implicit-flow responses automatically.
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();

                if (sessionError || !session) {
                    // Fall back to parsing the hash directly (implicit flow).
                    const hashParams = window.location.hash.substring(1);
                    const params = new URLSearchParams(hashParams);
                    const errorDesc = params.get('error_description') || params.get('error');

                    if (errorDesc) {
                        showAlert('Authentication error: ' + errorDesc, 'error');
                        return;
                    }

                    const accessToken = params.get('access_token');
                    if (!accessToken) {
                        showAlert('No authentication session found. Please try signing in again.', 'error');
                        return;
                    }

                    // Exchange the token for a Worker JWT
                    const result = await window.apiJson('/api/admin/exchange-token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ access_token: accessToken })
                    });

                    if (result.success) {
                        localStorage.setItem('adminToken', result.token);
                        localStorage.setItem('admin', JSON.stringify(result.admin));
                        window.location.href = '/admin-dashboard.html';
                    } else if (result.pending) {
                        showAlert('Your account has been created and is pending admin approval. Please contact an administrator.', 'error');
                    } else {
                        showAlert(result.error || result.message || 'Login failed', 'error');
                    }
                    // Clean up URL hash
                    window.history.replaceState({}, document.title, window.location.pathname);
                    return;
                }

                // Got a valid session from the SDK
                const accessToken = session.access_token;
                const result = await window.apiJson('/api/admin/exchange-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ access_token: accessToken })
                });

                // Clean up URL hash
                window.history.replaceState({}, document.title, window.location.pathname);

                if (result.success) {
                    localStorage.setItem('adminToken', result.token);
                    localStorage.setItem('admin', JSON.stringify(result.admin));
                    window.location.href = '/admin-dashboard.html';
                } else if (result.pending) {
                    // 202 — new Google user, profile created but pending approval
                    showAlert('Your account has been created and is pending admin approval. Please contact an administrator.', 'error');
                } else {
                    showAlert(result.error || result.message || 'Login failed', 'error');
                }
            } catch (err) {
                showAlert('Authentication error: ' + err.message, 'error');
            }
        })();
    </script>
</body>
</html>
