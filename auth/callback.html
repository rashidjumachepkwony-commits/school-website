<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/js/config.js"></script>
    <title>Authentication Callback - Changara Star Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001f5c 0%, #0b5394 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        .callback-container {
            background: white; padding: 40px; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 420px;
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #0b5394;
            border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; }
        .alert.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <div class="callback-container">
        <div id="spinner" class="spinner"></div>
        <h1>Authentication Callback</h1>
        <p class="subtitle">Completing your sign-in...</p>
        <div id="alert" class="alert" style="display:none;"></div>
    </div>

    <script>
        (function() {
            var alertEl = document.getElementById('alert');
            var spinnerEl = document.getElementById('spinner');
            function showAlert(msg, type) {
                spinnerEl.style.display = 'none';
                alertEl.className = 'alert ' + type;
                alertEl.style.display = 'block';
                alertEl.textContent = msg;
            }

            // ----------------------------------------------------------------
            // Parse the OAuth response from the URL hash fragment.
            //
            // Supabase's implicit-flow redirect places the access_token (and
            // other fields) in the hash.  We parse it directly rather than
            // relying on supabase.auth.getSession(), which async-hydrates from
            // localStorage and can hang when no session is stored locally.
            // ----------------------------------------------------------------
            var hash = window.location.hash.substring(1);
            var params = new URLSearchParams(hash);

            // Check for OAuth error
            var errorDesc = params.get('error_description') || params.get('error');
            if (errorDesc) {
                showAlert('Authentication error: ' + errorDesc, 'error');
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            var accessToken = params.get('access_token');
            if (!accessToken) {
                // No token in hash — could be a PKCE flow where the SDK already
                // exchanged the code.  Try to read from localStorage as last resort.
                var storedSession = localStorage.getItem('supabase.auth.token');
                if (storedSession) {
                    try {
                        var parsed = JSON.parse(storedSession);
                        accessToken = parsed.access_token || parsed.access_token;
                    } catch (e) { /* fall through */ }
                }
            }

            if (!accessToken) {
                showAlert('No authentication session found. Please try signing in again.', 'error');
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            }

            // ----------------------------------------------------------------
            // Exchange the Supabase access token for a Worker JWT via the
            // existing /api/admin/exchange-token endpoint.
            // ----------------------------------------------------------------
            showAlert('Verifying your account...', 'success');

            window.apiJson('/api/admin/exchange-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ access_token: accessToken })
            }).then(function(result) {
                // Clean up URL hash
                window.history.replaceState({}, document.title, window.location.pathname);

                if (result.pending) {
                    showAlert('Your account has been created and is pending admin approval. Please contact an administrator.', 'error');
                } else if (result.success) {
                    localStorage.setItem('adminToken', result.token);
                    localStorage.setItem('admin', JSON.stringify(result.admin));
                    window.location.href = '/admin-dashboard.html';
                } else {
                    showAlert(result.error || result.message || 'Login failed', 'error');
                }
            }).catch(function(err) {
                window.history.replaceState({}, document.title, window.location.pathname);
                showAlert('Authentication error: ' + err.message, 'error');
            });
        })();
    </script>
</body>
</html>
