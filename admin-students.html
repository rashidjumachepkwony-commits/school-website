<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #001f5c 0%, #0b5394 35%, #d4a017 70%, #ffeb99 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px;
}

.container {
  width: 100%;
  max-width: 1200px;
  padding: 30px;
  border-radius: 40px;
  background: linear-gradient(135deg, #ffffff, #f5f9ff, #fff8dc);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  text-align: center;
}

.header {
  background: linear-gradient(135deg, #001f5c, #0b5394);
  padding: 20px;
  border-radius: 30px;
  margin-bottom: 25px;
  color: white;
}
.header h1 { font-size: 42px; margin: 5px 0; color: #ffeb99; }
.header p { font-size: 24px; margin: 5px 0; color: #d4a017; font-weight: bold; }

.pin-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  backdrop-filter: blur(5px);
}

.pin-box {
  background: white;
  padding: 40px;
  border-radius: 30px;
  max-width: 450px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  text-align: center;
}

.pin-box h2 { color: #001f5c; font-size: 32px; margin-bottom: 10px; }
.pin-box p { color: #666; font-size: 18px; margin-bottom: 20px; }
.pin-box input {
  width: 100%; padding: 18px; font-size: 28px;
  border: 3px solid #ccc; border-radius: 15px;
  text-align: center; letter-spacing: 10px; margin-bottom: 15px;
}
.pin-box input:focus { border-color: #0b5394; outline: none; }
.pin-box .btn-unlock {
  background: linear-gradient(135deg, #0b5394, #1a6fb5);
  color: white; padding: 18px; font-size: 24px; font-weight: bold;
  border: none; border-radius: 15px; width: 100%; cursor: pointer; transition: transform 0.2s;
}
.pin-box .btn-unlock:hover { transform: scale(1.02); }
.pin-box .home-btn {
  display: inline-block; padding: 12px 25px; font-size: 18px; font-weight: bold;
  color: white; background: #6c757d; border: none; border-radius: 10px;
  cursor: pointer; margin-top: 10px; transition: all 0.3s; width: 100%;
}
.pin-box .home-btn:hover { background: #5a6268; transform: scale(1.02); }
.pin-box .pin-error { color: #dc3545; font-size: 18px; margin-top: 10px; display: none; }
.pin-box .pin-error.show { display: block; }

.hidden-content { display: none; }
.home-btn-main {
  display: inline-block; padding: 12px 25px; font-size: 18px; font-weight: bold;
  color: white; background: #0b5394; border: none; border-radius: 10px;
  cursor: pointer; margin-bottom: 15px; transition: all 0.3s;
}
.home-btn-main:hover { background: #1a6fb5; transform: scale(1.02); }

.form-section {
  background: white; border-radius: 25px; padding: 25px;
  margin: 20px 0; border: 4px solid #0b8f34;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
.form-title {
  font-size: 28px; font-weight: bold; color: #001f5c;
  margin-bottom: 20px; padding-bottom: 10px; border-bottom: 3px solid #0b8f34;
}
.form-title.list-title { border-bottom-color: #0b5394; }
.hidden-section { display: none !important; }

label { display: block; text-align: left; font-size: 20px; font-weight: bold; color: #001f5c; margin: 12px 0 5px 5px; }
input, select {
  width: 100%; padding: 16px; margin: 5px 0 15px 0; font-size: 22px;
  border: 3px solid #ccc; border-radius: 15px; background: #f9f9f9;
}
input:focus, select:focus {
  border-color: #0b8f34; outline: none; box-shadow: 0 0 15px rgba(11, 143, 52, 0.3);
}

.btn {
  padding: 20px; font-size: 28px; font-weight: bold; border: none;
  border-radius: 20px; width: 100%; cursor: pointer; margin: 10px 0; transition: transform 0.2s;
}
.btn:hover { transform: scale(1.02); }
.btn-add { background: linear-gradient(135deg, #0b8f34, #0cac47); color: white; box-shadow: 0 8px 25px rgba(11, 143, 52, 0.4); }
.btn-view { background: linear-gradient(135deg, #0b5394, #1a6fb5); color: white; box-shadow: 0 8px 25px rgba(11, 83, 148, 0.4); }
.btn-home { background: #d4a017; color: #001f5c; padding: 15px; font-size: 22px; border: none; border-radius: 15px; width: 100%; cursor: pointer; margin: 10px 0; font-weight: bold; }
.btn-home:hover { transform: scale(1.02); }
.btn-delete { background: #dc3545; color: white; padding: 8px 15px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
.btn-delete:hover { transform: scale(1.05); }
.btn-edit { background: #d4a017; color: #001f5c; padding: 8px 15px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-weight: bold; }
.btn-edit:hover { transform: scale(1.05); background: #e8b830; }
.btn-download { background: #0b8f34; color: white; padding: 8px 15px; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-weight: bold; }
.btn-download:hover { transform: scale(1.05); background: #0cac47; }

.search-container { display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
.search-container input { flex: 1; min-width: 200px; padding: 14px; font-size: 20px; border: 3px solid #ccc; border-radius: 12px; background: #f9f9f9; }
.search-container input:focus { border-color: #0b5394; outline: none; }
.search-container select { flex: 0 0 180px; padding: 14px; font-size: 20px; border: 3px solid #ccc; border-radius: 12px; background: #f9f9f9; }
.search-container select:focus { border-color: #0b5394; outline: none; }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 15px 0; }
.stat-card { background: #f8f9fa; border-radius: 12px; padding: 15px 10px; border: 2px solid #e0e0e0; text-align: center; }
.stat-card .number { font-size: 28px; font-weight: bold; }
.stat-card .label { font-size: 12px; color: #666; margin-top: 3px; }
.stat-total .number { color: #0b5394; }
.stat-male .number { color: #1a6fb5; }
.stat-female .number { color: #e83e8c; }

#msg { font-size: 24px; font-weight: bold; padding: 15px; border-radius: 15px; margin: 15px 0; min-height: 50px; }
.success { background: #d4edda; color: #155724; border: 3px solid #0b8f34; }
.error { background: #f8d7da; color: #721c24; border: 3px solid #dc3545; }
.warning { background: #fff3cd; color: #856404; border: 3px solid #ffc107; }
.info { background: #d1ecf1; color: #0c5460; border: 3px solid #0b5394; }
.hidden { display: none; }

.table-container { overflow-x: auto; margin-top: 15px; border-radius: 15px; border: 2px solid #e0e0e0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { background: #001f5c; color: white; padding: 12px 15px; text-align: center; white-space: nowrap; }
td { padding: 10px 15px; text-align: center; border-bottom: 1px solid #eee; }
tr:hover { background: #f5f5f5; }
tr:nth-child(even) { background: #fafafa; }
tr:nth-child(even):hover { background: #f0f0f0; }
.no-records { text-align: center; padding: 30px; color: #999; font-size: 18px; }
.loading { text-align: center; padding: 30px; color: #0b5394; font-size: 18px; }

.gender-male { color: #1a6fb5; font-weight: bold; }
.gender-female { color: #e83e8c; font-weight: bold; }
.badge-day { background: #d1ecf1; color: #0b5394; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
.badge-boarder { background: #f8d7da; color: #721c24; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
.action-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

@media (max-width: 600px) {
  .container { padding: 15px; }
  .header h1 { font-size: 28px; }
  input, select { font-size: 18px; padding: 12px; }
  .btn { font-size: 22px; padding: 16px; }
  th, td { padding: 8px 10px; font-size: 12px; }
  .search-container { flex-direction: column; }
  .search-container select { flex: 1; }
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
}
@media print { .no-print { display: none !important; } }
</style>
</head>
<body>
<div class="pin-overlay" id="pinOverlay">
  <div class="pin-box">
    <h2>&#128274; Student Management</h2>
    <p>Enter PIN to access student records</p>
    <input type="password" id="managementPin" placeholder="&#8226;&#8226;&#8226;&#8226;" maxlength="4" onkeypress="if(event.keyCode==13) unlockManagement()">
    <button class="btn-unlock" onclick="unlockManagement()">&#128273; UNLOCK</button>
    <button class="home-btn" onclick="goHome()">&#127968; Back to Home</button>
    <div class="pin-error" id="pinError">&#10060; Invalid PIN. Please try again.</div>
  </div>
</div>
<div class="container hidden-content" id="mainContent" style="display:none;">
  <div class="header">
    <h1>&#127881; Changara Star Academy</h1>
    <p>&#127895; Student Management Portal</p>
    <div id="datetime" style="font-size:18px;color:white;margin-top:8px;"></div>
  </div>
  <button class="home-btn-main no-print" onclick="goHome()">&#127968; Back to Home</button>
  <div id="msg" class="hidden"></div>
  <div class="form-section no-print" id="addSection">
    <div class="form-title">&#10010; Add New Student</div>
    <label>&#128100; Full Name:</label><input id="studentName" placeholder="Enter student's full name">
    <label>&#128218; Grade/Class:</label>
    <select id="studentClass">
      <option value="">Select Grade</option>
      <option value="Playgroup">&#127942; Playgroup</option><option value="PP1">&#128216; PP1</option><option value="PP2">&#128216; PP2</option>
      <option value="Grade 1">&#128218; Grade 1</option><option value="Grade 2">&#128218; Grade 2</option><option value="Grade 3">&#128218; Grade 3</option>
      <option value="Grade 4">&#128218; Grade 4</option><option value="Grade 5">&#128218; Grade 5</option><option value="Grade 6">&#128218; Grade 6</option>
    </select>
    <label>&#128100; Gender:</label>
    <select id="studentGender"><option value="">Select Gender</option><option value="Male">&#128101; Male</option><option value="Female">&#128103; Female</option></select>
    <label>&#127968; Student Type:</label>
    <select id="studentType"><option value="NO">&#128218; Day Scholar</option><option value="YES">&#127968; Boarder (Grades 3-6 Only)</option></select>
    <label>&#128222; Guardian Phone:</label><input id="guardianPhone" placeholder="e.g., 0712345678">
    <label>&#128274; Default PIN:</label><input id="studentPin" type="password" value="1234" placeholder="Enter PIN (default: 1234)">
    <button class="btn btn-add" onclick="addStudent()">&#10003; ADD STUDENT</button>
  </div>
  <div class="form-section list-section">
    <div class="form-title list-title">&#128203; Student List</div>
    <div class="stats-grid" id="statsContainer">
      <div class="stat-card stat-total"><div class="number" id="totalStudents">0</div><div class="label">&#128105; Total Students</div></div>
      <div class="stat-card stat-male"><div class="number" id="totalMale">0</div><div class="label">&#128101; Males</div></div>
      <div class="stat-card stat-female"><div class="number" id="totalFemale">0</div><div class="label">&#128103; Females</div></div>
    </div>
    <div class="search-container no-print">
      <input type="text" id="searchInput" placeholder="&#128269; Search by name, ID, or guardian..." onkeyup="searchStudents()">
      <select id="gradeFilter" onchange="searchStudents()"><option value="">All Grades</option><option value="Playgroup">&#127942; Playgroup</option><option value="PP1">&#128216; PP1</option><option value="PP2">&#128216; PP2</option><option value="Grade 1">&#128218; Grade 1</option><option value="Grade 2">&#128218; Grade 2</option><option value="Grade 3">&#128218; Grade 3</option><option value="Grade 4">&#128218; Grade 4</option><option value="Grade 5">&#128218; Grade 5</option><option value="Grade 6">&#128218; Grade 6</option></select>
      <select id="genderFilter" onchange="searchStudents()"><option value="">All Genders</option><option value="Male">&#128101; Male</option><option value="Female">&#128103; Female</option></select>
      <select id="typeFilter" onchange="searchStudents()"><option value="">All Types</option><option value="NO">&#128218; Day Scholar</option><option value="YES">&#127968; Boarder</option></select>
    </div>
    <button class="btn btn-view no-print" onclick="loadStudents()">&#128260; Refresh Student List</button>
    <div class="table-container">
      <table><thead><tr><th>#</th><th>Student ID</th><th>Name</th><th>Grade</th><th>Gender</th><th>Type</th><th>Guardian</th><th>Actions</th></tr></thead>
      <tbody id="studentTable"><tr><td colspan="8" class="loading">Loading students...</td></tr></tbody></table>
    </div>
  </div>
  <button class="btn-home no-print" onclick="goHome()">&#127968; Back to Home</button>
</div>
<script>
function goHome(){google.script.run.withSuccessHandler(function(u){window.top.location.href=u;}).getWebAppUrl();}
const MANAGEMENT_PIN="1010";
function unlockManagement(){var pin=document.getElementById("managementPin").value.trim();var err=document.getElementById("pinError");if(pin===MANAGEMENT_PIN){document.getElementById("pinOverlay").style.display="none";document.getElementById("mainContent").style.display="block";document.getElementById("mainContent").classList.remove("hidden-content");loadStudents();}else{err.classList.add("show");document.getElementById("managementPin").value="";document.getElementById("managementPin").focus();setTimeout(function(){err.classList.remove("show");},3000);}}
function updateDateTime(){var n=new Date();document.getElementById("datetime").innerHTML=n.toLocaleDateString('en-GB')+" | "+n.toLocaleTimeString('en-GB');}setInterval(updateDateTime,1000);updateDateTime();
let allStudentsData=[];
function searchStudents(){var st=document.getElementById("searchInput").value.toLowerCase().trim();var gf=document.getElementById("gradeFilter").value;var gdf=document.getElementById("genderFilter").value;var tf=document.getElementById("typeFilter").value;var f=allStudentsData;if(gf)f=f.filter(function(s){return s.grade===gf;});if(gdf)f=f.filter(function(s){return s.gender===gdf;});if(tf)f=f.filter(function(s){return s.isBoarding===(tf==="YES");});if(st)f=f.filter(function(s){return s.name.toLowerCase().includes(st)||s.id.toLowerCase().includes(st)||s.guardian.includes(st);});renderStudentsTable(f);}
function addStudent(){var name=document.getElementById("studentName").value.trim();var grade=document.getElementById("studentClass").value;var gender=document.getElementById("studentGender").value;var isB=document.getElementById("studentType").value==="YES";var guardian=document.getElementById("guardianPhone").value.trim();var pin=document.getElementById("studentPin").value.trim()||"1234";if(!name){showMsg("Please enter Student Name","error");return;}if(!grade){showMsg("Please select a Grade","error");return;}if(!gender){showMsg("Please select Gender","error");return;}if(isB&&!["Grade 3","Grade 4","Grade 5","Grade 6"].includes(grade)){showMsg("Boarding is only for Grades 3-6","error");return;}google.script.run.withSuccessHandler(function(r){if(r.includes("Successfully")){document.getElementById("studentName").value="";document.getElementById("studentClass").value="";document.getElementById("studentGender").value="";document.getElementById("studentType").value="NO";document.getElementById("guardianPhone").value="";document.getElementById("studentPin").value="1234";document.getElementById("msg").className="success";document.getElementById("msg").innerHTML=r;document.getElementById("msg").classList.remove("hidden");loadStudents();}else if(r.includes("already registered")){showMsg(r,"warning");}else{showMsg(r,"error");}}).withFailureHandler(function(e){showMsg("Error: "+e.message,"error");}).addStudent(name,grade,guardian,pin,gender,isB);}
function loadStudents(){google.script.run.withSuccessHandler(function(data){allStudentsData=data.students||[];document.getElementById("totalStudents").textContent=data.totalStudents||0;document.getElementById("totalMale").textContent=data.totalMale||0;document.getElementById("totalFemale").textContent=data.totalFemale||0;document.getElementById("searchInput").value="";document.getElementById("gradeFilter").value="";document.getElementById("genderFilter").value="";document.getElementById("typeFilter").value="";renderStudentsTable(allStudentsData);}).withFailureHandler(function(e){document.getElementById("studentTable").innerHTML='<tr><td colspan=8 style="color:red;text-align:center;padding:20px">Error: '+e.message+'</td></tr>';}).getAllStudents();}
function renderStudentsTable(students){var h="";if(!students||students.length===0){h='<tr><td colspan=8 class="no-records">No students found</td></tr>';}else{for(var i=0;i<students.length;i++){var s=students[i];var gc=s.gender==="Male"?"gender-male":s.gender==="Female"?"gender-female":"";var td=s.isBoarding?'<span class="badge-boarder">Boarder</span>':'<span class="badge-day">Day Scholar</span>';h+="<tr><td>"+(i+1)+"</td><td><strong>"+(s.id||"-")+"</strong></td><td>"+s.name+"</td><td>"+s.grade+"</td><td class=\""+gc+"\">"+(s.gender||"-")+"</td><td>"+td+"</td><td>"+(s.guardian||"-")+"</td><td><div class=\"action-buttons\"><button class=\"btn btn-delete\" onclick=\"deleteStudent('"+s.id+"')\">Delete</button></div></td></tr>";}}document.getElementById("studentTable").innerHTML=h;}
function showMessage(m,t){var el=document.getElementById("msg");el.textContent=m;el.className=t;el.classList.remove("hidden");setTimeout(function(){el.classList.add("hidden");},8000);}
window.onload=function(){document.getElementById("managementPin").focus();};
</script>
</body>
</html>
