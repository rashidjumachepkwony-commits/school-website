<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.5/dist/umd/supabase.min.js"></script>
    <title>Admin Login - Changara Star Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001f5c 0%, #0b5394 100%);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .login-container {
            background: white; padding: 40px; border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 420px;
        }
        .login-container h1 { text-align: center; color: #001f5c; margin-bottom: 5px; }
        .login-container .subtitle { text-align: center; color: #d4a017; margin-bottom: 30px; font-size: 14px; }
        .school-icon { text-align: center; font-size: 48px; display: block; margin-bottom: 10px; }

        /* Google-style button */
        #googleSignInBtn {
            width: 100%; padding: 12px 16px; border: 2px solid #dadce0;
            border-radius: 8px; background: white; color: #3c4043;
            font-size: 15px; font-weight: 500; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 20px;
        }
        #googleSignInBtn:hover { background: #f8f9fa; border-color: #c9c9c9; }
        #googleSignInBtn img { width: 18px; height: 18px; }

        .divider {
            display: flex; align-items: center; text-align: center; margin: 24px 0;
            color: #999; font-size: 13px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid #e0e0e0; }
        .divider span { padding: 0 12px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 16px; transition: border-color 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus { border-color: #0b5394; outline: none; }
        .btn-login {
            width: 100%; padding: 14px; background: #0b5394; color: white;
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-login:hover { background: #001f5c; transform: scale(1.02); }

        .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .alert.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        .forgot-link { text-align: center; margin-top: 16px; }
        .forgot-link a { color: #0b5394; text-decoration: none; font-size: 14px; }
        .forgot-link a:hover { text-decoration: underline; }
        .back-link { text-align: center; margin-top: 15px; }
        .back-link a { color: #0b5394; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <span class="school-icon">🏫</span>
        <h1>Admin Login</h1>
        <p class="subtitle">Changara Star Academy</p>

        <div id="alert" class="alert"></div>

        <!-- Google OAuth (via Supabase Auth) -->
        <button type="button" id="googleSignInBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/authentication/google.svg" alt="G">
            Sign in with Google
        </button>

        <div class="divider"><span>or sign in with email</span></div>

        <!-- Classic form login -->
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="username" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="forgot-link">
            <a href="reset-password.html">Forgot your password?</a>
        </div>

        <div class="link-switch" style="text-align: center; margin-top: 16px; font-size: 14px;">
            <a href="register.html">New user? Register here</a>
        </div>

        <div class="back-link">
            <a href="index.html">← Back to Website</a>
        </div>
    </div>

    <script>
        (async function() {
            const alertEl = document.getElementById('alert');
            const showAlert = function(msg, type) {
                alertEl.className = 'alert ' + type;
                alertEl.style.display = 'block';
                alertEl.textContent = msg;
            };

            // If already logged in, go to dashboard
            const token = localStorage.getItem('adminToken');
            if (token) {
                window.location.href = 'admin-dashboard.html';
                return;
            }

            // Fetch Supabase config from Worker
            let supabaseUrl = '', supabaseAnonKey = '';
            try {
                const cfg = await window.apiJson('/api/config');
                supabaseUrl = cfg.supabaseUrl || '';
                supabaseAnonKey = cfg.supabaseAnonKey || '';
            } catch (e) {
                console.error('Config fetch failed:', e);
            }

            // Redirect to Google OAuth via Supabase
            document.getElementById('googleSignInBtn').addEventListener('click', function() {
                if (!supabaseUrl || !supabaseAnonKey) {
                    showAlert('❌ Supabase is not configured on the server yet.', 'error');
                    return;
                }
                // Supabase handles the Google OAuth redirect — point the browser
                // to the Supabase auth endpoint with provider=google and redirect back
                // to /auth/callback which exchanges the token for a Worker JWT.
                const redirectUri = encodeURIComponent(window.location.origin + '/auth/callback');
                const authUrl = supabaseUrl + '/auth/v1/authorize?provider=google&redirect_to=' + redirectUri;
                window.location.href = authUrl;
            });

            // Helper: exchange Supabase access token for Worker JWT
            async function exchangeToken(accessToken) {
                const result = await window.apiJson('/api/admin/exchange-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ access_token: accessToken })
                });
                return result;
            }

            // Classic form login
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                showAlert('', '');

                if (!supabaseUrl || !supabaseAnonKey) {
                    showAlert('❌ Supabase is not configured on the server yet.', 'error');
                    return;
                }

                try {
                    // Use Supabase Auth for password sign-in
                    const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) {
                        showAlert('❌ ' + error.message, 'error');
                    } else if (data.user && data.session) {
                        const result = await exchangeToken(data.session.access_token);
                        if (result.success) {
                            localStorage.setItem('adminToken', result.token);
                            localStorage.setItem('admin', JSON.stringify(result.admin));
                            showAlert('✅ Login successful! Redirecting...', 'success');
                            setTimeout(function() { window.location.href = 'admin-dashboard.html'; }, 1000);
                        } else if (result.pending) {
                            showAlert('❌ ' + (result.message || 'Your account is pending admin approval.'), 'error');
                        } else {
                            showAlert('❌ ' + (result.error || result.message || 'Login failed'), 'error');
                        }
                    }
                } catch (error) {
                    showAlert('❌ ' + error.message, 'error');
                }
            });
        })();
    </script>
</body>
</html>
