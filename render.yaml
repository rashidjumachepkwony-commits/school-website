services:
  - type: web
    name: csa-school-system
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromSecret: mongodb-uri-atlas
      - key: FRONTEND_URL
        fromSecret: frontend-url
      - key: JWT_SECRET
        fromSecret: jwt-secret
