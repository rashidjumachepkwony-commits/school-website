<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/config.js"></script>
    <title>Student Check In/Out - Changara Star Academy</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f0fe 0%, #f5f5f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 480px;
        }
        .header { text-align: center; margin-bottom: 25px; }
        .header .icon { font-size: 64px; display: block; }
        .header h1 { color: #001f5c; font-size: 28px; margin-top: 10px; }
        .header p { color: #666; margin-top: 5px; }
        .time-display { text-align: center; color: #0b5394; font-size: 16px; font-weight: bold; margin-bottom: 15px; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-buttons button {
            flex: 1; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px;
            background: white; cursor: pointer; font-weight: bold; font-size: 16px;
            transition: all 0.3s ease; color: #666;
        }
        .tab-buttons button.active { background: #0b5394; color: white; border-color: #0b5394; }
        .tab-buttons button:hover:not(.active) { border-color: #0b5394; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 5px; font-size: 14px; }
        .form-group label .required { color: #dc3545; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px;
            font-size: 15px; transition: border-color 0.3s ease; font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #0b5394; outline: none;
        }
        .btn-checkin {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #28a745, #1e7e34);
            color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-checkin:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4); }
        .btn-checkin:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .btn-checkout {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #dc3545, #c82333);
            color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
        }
        .btn-checkout:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(220, 53, 69, 0.4); }
        .btn-checkout:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .alert {
            padding: 12px 16px; border-radius: 8px; margin-bottom: 15px; display: none; font-size: 14px;
        }
        .alert.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert.info { display: block; background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .student-info {
            background: #f8f9fa; padding: 15px; border-radius: 8px; margin: 15px 0;
            display: none; border-left: 4px solid #0b5394;
        }
        .student-info p { margin: 5px 0; font-size: 14px; color: #555; }
        .student-info .label { font-weight: 600; color: #333; }
        .student-info .status { font-weight: bold; padding: 4px 10px; border-radius: 20px; font-size: 12px; display: inline-block; }
        .student-info .status.present { background: #d4edda; color: #155724; }
        .student-info .status.late { background: #fff3cd; color: #856404; }
        .student-info .status.checked-out { background: #d1ecf1; color: #0c5460; }
        .buttons-row { display: flex; gap: 10px; margin-top: 15px; }
        .buttons-row button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s ease; }
        .btn-home { background: #6c757d; color: white; }
        .btn-home:hover { background: #5a6268; }
        .btn-portal { background: #0b5394; color: white; }
        .btn-portal:hover { background: #001f5c; }
        #checkinForm, #checkoutForm { display: none; }
        #checkinForm.active, #checkoutForm.active { display: block; }
        .loading {
            display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3;
            border-top: 3px solid #28a745; border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 480px) { .container { padding: 20px; } .tab-buttons button { font-size: 14px; padding: 10px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="icon">🎓</span>
            <h1>Student Check In/Out</h1>
            <p>Changara Star Academy</p>
        </div>

        <div id="timeDisplay" class="time-display">🕐 Loading time...</div>

        <div id="alert" class="alert"></div>

        <div id="studentInfo" class="student-info">
            <p><span class="label">👤 Name:</span> <span id="studentName"></span></p>
            <p><span class="label">🆔 Student ID:</span> <span id="studentId"></span></p>
            <p><span class="label">📚 Grade:</span> <span id="studentGrade"></span></p>
            <p><span class="label">📊 Status:</span> <span id="studentStatus" class="status"></span></p>
            <p><span class="label">⏰ Check In:</span> <span id="studentCheckIn"></span></p>
            <p><span class="label">🚪 Check Out:</span> <span id="studentCheckOut"></span></p>
        </div>

        <div class="tab-buttons">
            <button class="active" onclick="switchTab('checkin')">✅ Check In</button>
            <button onclick="switchTab('checkout')">🚪 Check Out</button>
        </div>

        <form id="checkinForm" class="active">
            <div class="form-group">
                <label>Student ID <span class="required">*</span></label>
                <input type="text" id="checkinStudentId" placeholder="Enter your Student ID" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>PIN <span class="required">*</span></label>
                <input type="password" id="checkinPin" placeholder="Enter your 4-digit PIN" required maxlength="6" autocomplete="off">
            </div>
            <button type="submit" id="checkinBtn" class="btn-checkin">✅ Check In</button>
        </form>

        <form id="checkoutForm">
            <div class="form-group">
                <label>Student ID <span class="required">*</span></label>
                <input type="text" id="checkoutStudentId" placeholder="Enter your Student ID" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>PIN <span class="required">*</span></label>
                <input type="password" id="checkoutPin" placeholder="Enter your 4-digit PIN" required maxlength="6" autocomplete="off">
            </div>
            <button type="submit" id="checkoutBtn" class="btn-checkout">🚪 Check Out</button>
        </form>

        <div class="buttons-row">
            <button onclick="window.location.href='portal.html'" class="btn-home">🏠 Back to Portal</button>
            <button onclick="window.location.href='index.html'" class="btn-portal">🏫 Homepage</button>
        </div>
    </div>

    <script>
        const checkinForm = document.getElementById('checkinForm');
        const checkoutForm = document.getElementById('checkoutForm');
        const checkinBtn = document.getElementById('checkinBtn');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const alertDiv = document.getElementById('alert');
        const studentInfo = document.getElementById('studentInfo');
        const timeDisplay = document.getElementById('timeDisplay');

        function updateTime() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'Africa/Nairobi' };
            timeDisplay.textContent = '🕐 Kenya Time: ' + now.toLocaleTimeString('en-KE', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        function switchTab(tab) {
            document.querySelectorAll('.tab-buttons button').forEach(b => b.classList.remove('active'));
            if (tab === 'checkin') {
                document.querySelector('.tab-buttons button:first-child').classList.add('active');
                checkinForm.classList.add('active');
                checkoutForm.classList.remove('active');
                hideAlert();
                hideStudentInfo();
            } else {
                document.querySelector('.tab-buttons button:last-child').classList.add('active');
                checkoutForm.classList.add('active');
                checkinForm.classList.remove('active');
                hideAlert();
                hideStudentInfo();
            }
        }

        function showAlert(message, type) {
            alertDiv.className = 'alert ' + type;
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
        }

        function hideAlert() { alertDiv.style.display = 'none'; }

        function showStudentInfo(data) {
            studentInfo.style.display = 'block';
            document.getElementById('studentName').textContent = data.name;
            document.getElementById('studentId').textContent = data.studentId;
            document.getElementById('studentGrade').textContent = data.grade || 'N/A';
            const statusEl = document.getElementById('studentStatus');
            statusEl.textContent = data.status;
            statusEl.className = 'status ' + data.statusClass;
            document.getElementById('studentCheckIn').textContent = data.checkIn || 'Not checked in';
            document.getElementById('studentCheckOut').textContent = data.checkOut || 'Not checked out';
        }

        function hideStudentInfo() { studentInfo.style.display = 'none'; }

        function refreshPage() { setTimeout(() => { window.location.reload(); }, 3000); }

        async function handleCheckInOut(studentId, pin, action) {
            try {
                const btn = action === 'IN' ? checkinBtn : checkoutBtn;
                btn.disabled = true;
                btn.innerHTML = '<span class="loading"></span> Processing...';

                const response = await fetch('/api/student/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ studentId, pin, action })
                });
                const result = await response.json();

                if (result.success) {
                    showAlert(result.message, 'success');
                    showStudentInfo({
                        name: result.student.name,
                        studentId: result.student.studentId,
                        grade: result.student.grade,
                        status: result.message.includes('LATE') ? 'LATE' : (action === 'IN' ? 'PRESENT' : 'CHECKED OUT'),
                        statusClass: result.message.includes('LATE') ? 'late' : (action === 'IN' ? 'present' : 'checked-out'),
                        checkIn: result.timeFormatted,
                        checkOut: action === 'OUT' ? result.timeFormatted : null
                    });
                    refreshPage();
                } else {
                    showAlert(result.message || 'Operation failed', 'error');
                    btn.disabled = false;
                    btn.innerHTML = action === 'IN' ? '✅ Check In' : '🚪 Check Out';
                }
            } catch (error) {
                showAlert('Error: ' + error.message, 'error');
                const btn = action === 'IN' ? checkinBtn : checkoutBtn;
                btn.disabled = false;
                btn.innerHTML = action === 'IN' ? '✅ Check In' : '🚪 Check Out';
            }
        }

        checkinForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const studentId = document.getElementById('checkinStudentId').value.trim();
            const pin = document.getElementById('checkinPin').value.trim();
            if (!studentId || !pin) { showAlert('Please enter Student ID and PIN', 'error'); return; }
            await handleCheckInOut(studentId, pin, 'IN');
        });

        checkoutForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const studentId = document.getElementById('checkoutStudentId').value.trim();
            const pin = document.getElementById('checkoutPin').value.trim();
            if (!studentId || !pin) { showAlert('Please enter Student ID and PIN', 'error'); return; }
            await handleCheckInOut(studentId, pin, 'OUT');
        });
    </script>
</body>
</html>
