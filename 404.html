<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Changara Star Academy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a3a1a 0%, #2d5a2d 100%);
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 520px; }
        .code { font-size: 96px; font-weight: 800; color: #f0c420; line-height: 1; }
        h1 { font-size: 24px; margin: 16px 0 8px; }
        p { font-size: 16px; opacity: 0.85; margin-bottom: 28px; }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #f0c420;
            color: #1a3a1a;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            transition: opacity .2s ease;
        }
        .btn:hover { opacity: .85; }
        .flag { margin-top: 30px; font-size: 14px; opacity: .75; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for could not be found on Changara Star Academy's website.</p>
        <a class="btn" href="/index.html">🏠 Back to Home</a>
        <div class="flag">🇰🇪 Changara Star Academy &mdash; Excellence in Education</div>
    </div>
</body>
</html>
